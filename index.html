const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idOf=n=>n.trim().toLowerCase().replace(/[.$#\[\]\/\s]+/g,'_').slice(0,24)||'p';
const sget=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const sset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
let rdb,me=null,code=null,L=null,P=[],W={},offs=[],err='';
const inc=n=>firebase.database.ServerValue.increment(n);
const lref=()=>rdb.ref('lobbies/'+code);
const isHost=()=>L&&me&&L.host===me.id;

if(firebaseConfig.apiKey==='YOUR_API_KEY'){
  $('#app').innerHTML='<h1>🎭 Who Am I?</h1><p class="err">Firebase isn\'t set up yet. Paste your Firebase config into the top of this file (see the setup steps).</p>';
}else{
  firebase.initializeApp(firebaseConfig);rdb=firebase.database();
  const c=sget('wai_code'),n=sget('wai_name');
  if(c&&n){me={name:n,id:idOf(n)};code=c;join().catch(()=>{code=null}).then(render)}else render();
}

async function enter(create){
  const name=$('#nm').value.trim().replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,16);
  if(!name){err='Enter a username';return render()}
  me={name,id:idOf(name)};
  code=create?Array.from({length:4},()=>pick('ABCDEFGHJKLMNPQRSTUVWXYZ')).join(''):$('#cd').value.trim().toUpperCase();
  try{
    if(create&&(await lref().child('host').get()).exists()){return enter(true)}
    if(create)await lref().update({host:me.id,pool:'games,movies,history,anime,pop,tv,books,sports,lol',maxRounds:5,winScore:3,round:0,status:'lobby'});
    else if(!(await lref().child('host').get()).exists()){code=null;err='Lobby not found';return render()}
    await join();err='';
  }catch(e){code=null;err='Could not connect: '+(e.message||e)}
  render();
}
async function join(){
  if(!(await lref().child('host').get()).exists())throw new Error('Lobby no longer exists');
  const pr=lref().child('players/'+me.id);
  if(!(await pr.get()).exists())await pr.set({id:me.id,name:me.name,score:0});
  sset('wai_code',code);sset('wai_name',me.name);
  offs.forEach(f=>f());
  const r1=lref(),f1=r1.on('value',s=>{
    const v=s.val();
    if(!v){L=null}else{L={...v,assign:v.assign||{},done:v.done||{}};P=Object.values(v.players||{})}
    if(L&&!P.some(p=>p.id===me.id)){err='You were removed from the lobby';return leave()}
    render();
  });
  const r2=rdb.ref('profiles'),f2=r2.on('value',s=>{W=s.val()||{};render()});
  offs=[()=>r1.off('value',f1),()=>r2.off('value',f2)];
}
function kick(id){if(confirm('Remove this player from the lobby?'))lref().child('players/'+id).remove()}
function leave(){offs.forEach(f=>f());offs=[];sset('wai_code','');code=null;L=null;P=[];render()}

const upd=o=>lref().update(o);
function stepper(label,key,min,max){
  return `<div class="row" style="margin-bottom:8px"><span>${label}</span><span class="step"><button class="s" onclick="adj('${key}',-1,${min},${max})">−</button><b>${L[key]}</b><button class="s" onclick="adj('${key}',1,${min},${max})">+</button></span></div>`;
}
function adj(k,d,mn,mx){upd({[k]:Math.max(mn,Math.min(mx,L[k]+d))})}
const CATS=[['games','🎮 Video games'],['movies','🎬 Movies'],['history','🏛️ History'],['anime','🍥 Anime'],['pop','⭐ Pop culture'],['tv','📺 TV'],['books','📚 Books & fantasy'],['sports','🏅 Athletes'],['lol','⚔️ League of Legends']];
const LISTS=()=>({games:GAMES,movies:MOVIES,history:HISTORY,anime:ANIME,pop:POP,tv:TV,books:BOOKS,sports:SPORTS,lol:LOL});
const sel=()=>!L.pool||L.pool==='both'?CATS.map(c=>c[0]):L.pool.split(',').filter(k=>LISTS()[k]);
function toggleCat(k){
  const cur=sel(),next=cur.includes(k)?cur.filter(x=>x!==k):cur.concat(k);
  if(!next.length)return;
  upd({pool:CATS.map(c=>c[0]).filter(x=>next.includes(x)).join(',')});
}
const poolSel=()=>`<div class="mu" style="margin-bottom:6px">Categories (tap to turn on/off)</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${CATS.map(c=>`<button class="${sel().includes(c[0])?'':'s'}" style="padding:8px 12px;min-height:40px" onclick="toggleCat('${c[0]}')">${sel().includes(c[0])?'✓ ':''}${c[1]}</button>`).join('')}</div>`;
const poolName=()=>CATS.filter(c=>sel().includes(c[0])).map(c=>c[1].replace(/^\S+ /,'')).join(', ');
function pool(){const l=LISTS();return [...new Set(sel().flatMap(k=>l[k]))]}

const usedList=()=>Array.isArray(L.used)?L.used:Object.values(L.used||{});
async function startRound(re){
  if(re!==true&&L.round>=L.maxRounds)return endRound();
  // "used" only holds characters from rounds actually played, so rerolling an unfinished round doesn't burn them.
  let used=usedList();
  const done=re===true?(L.done||{}):{},assign={},cur=Object.values(L.assign||{});
  const keep=P.filter(p=>done[p.id]&&L.assign[p.id]); // players who already scored keep their character
  keep.forEach(p=>{assign[p.id]=L.assign[p.id]});
  used=[...new Set(used.concat(keep.map(p=>assign[p.id])))];
  const todo=P.filter(p=>!assign[p.id]),all=pool(),skip=new Set(used);
  let src=all.filter(x=>!skip.has(x)&&!Object.values(assign).includes(x));
  if(re===true){const fresh=src.filter(x=>!cur.includes(x));if(fresh.length>=todo.length)src=fresh} // don't hand the same ones straight back
  if(src.length<todo.length){used=keep.map(p=>assign[p.id]);src=all.filter(x=>!used.includes(x))}
  todo.forEach(p=>{assign[p.id]=src.splice(Math.floor(Math.random()*src.length),1)[0]});
  await upd({status:'playing',round:re===true?L.round:L.round+1,assign,done:re===true?L.done||null:null,used});
}
async function award(id){
  if(L.done[id])return;
  await upd({['players/'+id+'/score']:inc(1),['done/'+id]:true});
}
async function endRound(){
  if(L.status==='over')return;
  const top=Math.max(0,...P.map(p=>p.score||0));
  const over=top>=L.winScore||L.round>=L.maxRounds;
  await upd({status:over?'over':'between',used:[...new Set(usedList().concat(Object.values(L.assign||{})))]});
  if(over)for(const p of P){
    const pr=rdb.ref('profiles/'+p.id);
    await pr.update({id:p.id,games:inc(1),wins:inc((p.score||0)===top&&top>0?1:0)});
  }
}
async function reset(){
  const u={status:'lobby',round:0,assign:null,done:null};
  P.forEach(p=>{u['players/'+p.id+'/score']=0});
  await upd(u);
}
function copyLink(){const t=`Join my Who Am I game! Lobby code: ${code}\n${location.href.split('#')[0]}`;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Invite copied!')).catch(()=>alert(t))}

function render(){
  const a=$('#app');if(!rdb)return;
  if(!code||!L){
    a.innerHTML=`<h1>🎭 Who Am I?</h1><p class="mu">Everyone sees your character but you. Ask yes/no questions on voice chat to figure it out!</p>
    <div class="card"><input id="nm" placeholder="Your username" maxlength="16" value="${esc(sget('wai_name'))}">
    <button style="width:100%;margin-bottom:12px" onclick="enter(true)">Create lobby</button>
    <div class="mu" style="margin-bottom:6px">or join a friend's lobby</div>
    <input id="cd" placeholder="Lobby code" maxlength="4" style="text-transform:uppercase">
    <button class="s" style="width:100%" onclick="enter(false)">Join lobby</button></div><div class="err">${esc(err)}</div>`;
    return;
  }
  const h=isHost(),st=L.status,sorted=P.slice().sort((x,y)=>(y.score||0)-(x.score||0));
  let html=`<div class="row"><div><div class="mu">Lobby code · Round ${L.round}/${L.maxRounds} · First to ${L.winScore}</div><div class="code">${esc(code)}</div></div><div><button class="s" onclick="copyLink()">Invite</button></div></div>`;
  if(st==='over'){
    const top=sorted[0]?sorted[0].score||0:0,ws=sorted.filter(p=>(p.score||0)===top).map(p=>esc(p.name)).join(' & ');
    html+=`<div class="card" style="text-align:center"><div style="font-size:48px">${top>0?'🏆':'🤝'}</div><div class="big">${top>0?ws+(sorted.filter(p=>(p.score||0)===top).length>1?' tie!':' wins!'):'No winner this time'}</div></div>`;
  }
  if(st==='playing'||st==='between'||st==='over'){
    html+=`<h2>${st==='playing'?'Round '+L.round+' · guess who you are':'Round '+L.round+' reveal'}</h2>`;
    P.forEach(p=>{
      const mine=p.id===me.id,late=!L.assign[p.id],show=!late&&(!mine||st!=='playing'),d=L.done[p.id];
      html+=`<div class="card row"><div><div class="mu">${esc(p.name)}${mine?' (you)':''}</div>${late?'<div class="mu">Joins next round</div>':show?`<div class="big">${esc(L.assign[p.id])}</div>`:'<div class="hid">? ? ?</div>'}</div>
      ${d?'<span style="color:var(--ok);font-weight:700">✓ Guessed</span>':(h&&st==='playing'&&!late?`<button class="ok" onclick="award('${p.id}')">Got it +1</button>`:'')}</div>`;
    });
  }
  html+=`<h2>Scoreboard</h2><div class="card">`+sorted.map(p=>`<div class="row" style="padding:6px 0"><span>${p.id===L.host?'👑 ':''}${esc(p.name)}${p.id===me.id?' (you)':''} <span class="mu">🏅${(W[p.id]||{}).wins||0} wins</span></span><span class="sc">${p.score||0}${h&&p.id!==me.id?` <button class="s" style="padding:2px 10px;min-height:32px" onclick="kick('${p.id}')">✕</button>`:''}</span></div>`).join('')+`</div>`;
  if(h&&(st==='lobby'||st==='between')){
    html+=`<h2>Game settings</h2><div class="card">${poolSel()}${stepper('Max rounds','maxRounds',1,30)}${stepper('Score to win','winScore',1,15)}</div>`;
  }else if(st==='lobby'||st==='between'){
    html+=`<p class="mu">Categories: ${poolName()} · Waiting for the host…</p>`;
  }
  if(h){
    if(st==='lobby'||st==='between')html+=`<button style="width:100%" ${P.length<2?'disabled':''} onclick="startRound()">${st==='lobby'?'Start game':'Next round'}</button>${P.length<2?'<p class="mu">Need at least 2 players.</p>':''}`;
    if(st==='playing')html+=`<h2>Reroll</h2><div class="card">${poolSel()}<button class="s" style="width:100%" onclick="startRound(true)">Reroll characters</button></div><button style="width:100%" onclick="endRound()">End round &amp; reveal</button>`;
    if(st==='over')html+=`<button style="width:100%" onclick="reset()">Play again</button>`;
    if(st!=='lobby'&&st!=='over')html+=`<button class="s" style="width:100%;margin-top:8px" onclick="if(confirm('End the whole game?')){L.round=L.maxRounds;endRound()}">End game now</button>`;
  }else html+=`<button class="s" style="width:100%" onclick="if(confirm('Take over as host?'))upd({host:'${me.id}'})">Take over as host</button>`;
  html+=`<button class="s" style="width:100%;margin-top:8px" onclick="leave()">Leave lobby</button>`;
  a.innerHTML=html;
}
</script></body></html>
